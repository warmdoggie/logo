server {
    listen 80;
    server_name logo.heciai.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name logo.heciai.net;

    ssl_certificate /etc/letsencrypt/live/logo.heciai.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logo.heciai.net/privkey.pem;

    auth_basic "S7 Logo Stability";
    auth_basic_user_file /etc/nginx/.htpasswd-s7-logo;

    client_max_body_size 50m;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    access_log /var/log/nginx/s7-logo-access.log;
    error_log /var/log/nginx/s7-logo-error.log;

    location = /s7 {
        return 301 /s7/;
    }

    location /s7/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
