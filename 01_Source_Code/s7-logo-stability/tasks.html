<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S7 Logo Stability</title><link rel="stylesheet" href="tasks.css"></head>
<body><main class="tasks-layout">
 <section class="task-workspace" aria-label="当前任务"><div id="task-views"></div><p id="task-message" role="status">正在读取任务…</p></section>
 <aside class="task-sidebar" aria-label="任务栏"><header><div><span>我的工作空间</span><h1>任务</h1></div><button id="new-task" type="button">＋ 新建任务</button></header><p class="task-hint">每个任务独立保存素材、布局和结果。</p><nav id="task-list" aria-label="任务列表"></nav><form id="rename-task" hidden><label for="task-title">当前任务名称</label><input id="task-title" maxlength="80" required><button type="submit">保存名称</button></form><p class="task-hint">生成任务在后台独立运行。切换模块、刷新页面或退出登录后，重新进入即可恢复进度和结果。本地服务需保持运行。</p></aside>
</main><script type="module" src="tasks.js"></script></body></html>
