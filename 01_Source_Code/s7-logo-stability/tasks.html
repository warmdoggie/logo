<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S7 Logo Stability</title><link rel="stylesheet" href="tasks.css"></head>
<body><main class="tasks-layout">
 <section class="task-workspace" aria-label="当前客户任务"><div id="task-views"></div></section>
 <aside class="task-sidebar" aria-label="任务栏"><header><div><span>我的工作空间</span><div class="task-title-row"><h1>客户任务</h1><button id="delete-all-tasks" type="button" class="task-delete-all" title="永久删除当前账号全部客户任务" disabled>全部删除</button></div></div><button id="new-task" type="button">＋ 创建客户任务</button><input id="task-search" type="search" placeholder="搜索客户名称" aria-label="按客户名称搜索任务" autocomplete="off"></header><p id="task-message" role="status" aria-live="polite">正在读取任务…</p><p class="task-hint">每个客户任务独立保存素材、布局和结果。</p><nav id="task-list" aria-label="客户任务列表"></nav><p id="task-search-empty" class="task-hint" role="status" hidden>未找到匹配的客户任务</p><form id="rename-task" hidden><label for="task-title">当前客户名称</label><input id="task-title" maxlength="80" required><button type="submit">保存客户名称</button></form><p class="task-hint">客户任务在后台独立运行。切换模块、刷新页面或退出登录后，重新进入即可恢复进度和结果。本地服务需保持运行。</p></aside>
</main><dialog id="create-task-dialog" aria-labelledby="create-task-heading"><form id="create-task-form"><h2 id="create-task-heading">创建客户任务</h2><label for="new-task-title">客户名称</label><input id="new-task-title" maxlength="80" required autofocus placeholder="请输入客户名称"><small>请输入客户名称，1–80 个字，可在客户任务栏修改。</small><div class="create-task-actions"><button id="cancel-create-task" type="button">取消</button><button id="create-task-submit" type="submit" disabled>创建客户任务</button></div></form></dialog><script type="module" src="tasks.js"></script></body></html>
